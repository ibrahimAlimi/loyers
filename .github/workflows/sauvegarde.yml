# Sauvegarde quotidienne de la base de production (conservée 30 jours comme artifact privé du dépôt).
name: Sauvegarde base de production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - name: Installer le client PostgreSQL 17
        run: |
          sudo apt-get install -y wget ca-certificates
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17

      - name: Exporter la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Secret SUPABASE_DB_URL manquant"; exit 1; fi
          NOM="sauvegarde-$(date -u +%Y-%m-%d).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage | gzip > "$NOM"
          echo "NOM=$NOM" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM }}
          path: ${{ env.NOM }}
          retention-days: 30
